spring:
  application:
    name: meunegocio360-core
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}

app:
  auth:
    max-tentativas: ${APP_AUTH_MAX_TENTATIVAS:5}
    bloqueio-minutos: ${APP_AUTH_BLOQUEIO_MINUTOS:15}
    jwt:
      secret: ${JWT_SECRET}
      expiracao-minutos: ${APP_AUTH_JWT_EXPIRACAO_MINUTOS:15}
    refresh:
      expiracao-dias: ${APP_AUTH_REFRESH_EXPIRACAO_DIAS:7}
    cookie:
      secure: ${APP_AUTH_COOKIE_SECURE:true}
  api-docs:
    public: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
